<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Relay Wake Settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="options-page">
    <main class="settings">
      <header>
        <h1>Chat Relay Wake</h1>
        <p>Wake one ChatGPT task when the harness reports pending relay work.</p>
      </header>

      <form id="settings-form">
        <label class="toggle-row">
          <span>Enabled</span>
          <input id="enabled" name="enabled" type="checkbox">
        </label>

        <label class="toggle-row">
          <span>Wake only for configured owner DMs</span>
          <input id="ownerOnly" name="ownerOnly" type="checkbox">
        </label>

        <label>
          Harness status URL
          <input id="statusUrl" name="statusUrl" type="url" required spellcheck="false">
        </label>

        <label>
          Wake status token
          <input id="wakeToken" name="wakeToken" type="password" autocomplete="off" spellcheck="false">
        </label>

        <label>
          Discord relay ChatGPT URL
          <input id="relayTargetUrl" name="relayTargetUrl" type="url" required placeholder="https://chatgpt.com/g/g-.../c/..." spellcheck="false">
        </label>

        <label>
          Fastlane ChatGPT URL
          <input id="fastLaneTargetUrl" name="fastLaneTargetUrl" type="url" placeholder="https://chatgpt.com/g/g-.../c/..." spellcheck="false">
        </label>

        <label>
          Autonomous ChatGPT URL
          <input id="autonomousTargetUrl" name="autonomousTargetUrl" type="url" placeholder="https://chatgpt.com/g/g-.../c/..." spellcheck="false">
        </label>

        <label class="toggle-row">
          <span>Attest manual owner messages</span>
          <input id="directOwnerEnabled" name="directOwnerEnabled" type="checkbox">
        </label>

        <label>
          Owner ChatGPT URL
          <input id="ownerTargetUrl" name="ownerTargetUrl" type="url" placeholder="https://chatgpt.com/g/g-.../c/..." spellcheck="false">
        </label>

        <label>
          Capability broker URL
          <input id="brokerUrl" name="brokerUrl" type="url" placeholder="http://127.0.0.1:3400" spellcheck="false">
        </label>

        <label>
          Direct ChatGPT ingress token
          <input id="directChatgptToken" name="directChatgptToken" type="password" autocomplete="off" spellcheck="false">
        </label>

        <label>
          Owner capability audiences
          <input id="directOwnerAudiences" name="directOwnerAudiences" type="text" spellcheck="false">
        </label>

        <label class="toggle-row">
          <span>Enable durable orchestration delivery</span>
          <input id="orchestrationDeliveryEnabled" name="orchestrationDeliveryEnabled" type="checkbox">
        </label>

        <label>
          Orchestration delivery URL
          <input id="orchestrationDeliveryUrl" name="orchestrationDeliveryUrl" type="url" placeholder="https://orchestrator.example" spellcheck="false">
        </label>

        <label>
          Orchestration delivery token
          <input id="orchestrationDeliveryToken" name="orchestrationDeliveryToken" type="password" autocomplete="off" spellcheck="false">
        </label>

        <div class="two-columns">
          <label>
            Poll interval (minutes)
            <input id="pollMinutes" name="pollMinutes" type="number" min="0.5" max="60" step="0.5">
          </label>
          <label>
            Fast lane interval (seconds)
            <input id="fastLanePollSeconds" name="fastLanePollSeconds" type="number" min="5" max="300" step="1">
          </label>
        </div>

        <label class="toggle-row">
          <span>Use fast lane for the configured Discord guild/channel</span>
          <input id="fastLaneEnabled" name="fastLaneEnabled" type="checkbox">
        </label>

        <div class="two-columns">
          <label>
            Cooldown (seconds)
            <input id="cooldownSeconds" name="cooldownSeconds" type="number" min="30" max="3600" step="1">
          </label>
        </div>

        <label>
          Unresolved retry schedule (minutes)
          <input id="backoffScheduleMinutes" name="backoffScheduleMinutes" type="text" required placeholder="5, 15, 30, 60" spellcheck="false">
        </label>

        <label>
          Wake prompt
          <textarea id="wakePrompt" name="wakePrompt" rows="3"></textarea>
        </label>
        <label>
          Spontaneous wake prompt
          <textarea id="spontaneousWakePrompt" name="spontaneousWakePrompt" rows="3"></textarea>
        </label>
        <label>
          Autonomous wake prompt
          <textarea id="autonomousWakePrompt" name="autonomousWakePrompt" rows="3"></textarea>
        </label>

        <label class="toggle-row">
          <span>Submit wake prompt automatically</span>
          <input id="autoSubmit" name="autoSubmit" type="checkbox">
        </label>

        <label class="toggle-row">
          <span>Open the configured task when missing</span>
          <input id="openIfMissing" name="openIfMissing" type="checkbox">
        </label>

        <div class="actions">
          <button type="submit">Save</button>
          <button id="test" type="button" class="secondary">Save and force check</button>
        </div>

        <label class="toggle-row">
          <span>Flush leased/in-progress relay items too</span>
          <input id="flushLeased" name="flushLeased" type="checkbox">
        </label>

        <div class="actions">
          <button id="flushQueue" type="button" class="danger">Flush relay queue</button>
        </div>
        <output id="message" aria-live="polite"></output>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
